<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1633">
<title>مصاريفي الشهرية</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" id="phone">
  <div class="bg-pattern" aria-hidden="true"></div>
  <svg class="bg-curves" viewBox="0 0 480 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 250 C 120 150, 300 320, 500 190" fill="none" stroke="url(#gline)" stroke-width="2"/>
    <path d="M-20 285 C 140 200, 320 340, 500 240" fill="none" stroke="url(#gline)" stroke-width="1.2"/>
    <defs>
      <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
        <stop offset="50%" stop-color="#E9C46A" stop-opacity=".85"/>
        <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ============ 1) الشاشة الرئيسية ============ -->
  <section class="screen is-active" id="screen-main" aria-label="المصاريف الشهرية">
    <div class="screen-inner">
      <div class="title-panel"><h1>مصاريفي الشهرية</h1><span class="gold-underline"></span></div>

      <div class="month-bar">
        <button class="icon-box sm" id="btn-month-picker" aria-label="اختيار الشهر">
          <svg viewBox="0 0 24 24" class="gi"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v9H5v-9h14zM7 12h3v3H7v-3z"/></svg>
        </button>
        <button class="arrow" id="btn-prev-month" aria-label="الشهر السابق">
          <svg viewBox="0 0 24 24" class="gi"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="month-label" id="month-label">يوليو 2026</div>
        <button class="arrow" id="btn-next-month" aria-label="الشهر التالي">
          <svg viewBox="0 0 24 24" class="gi"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="secret-card">
        <button class="eye-btn" data-eye aria-label="إظهار أو إخفاء المبالغ">
          <svg viewBox="0 0 24 24" class="gi"><g fill="none" stroke="currentColor" stroke-width="1.9"><path d="M1.8 12S5.5 5.5 12 5.5 22.2 12 22.2 12 18.5 18.5 12 18.5 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.2"/></g></svg>
        </button>
        <button class="secret-main" id="card-budget" aria-label="تعديل المبلغ الإجمالي">
          <span class="secret-label">المبلغ الإجمالي</span>
          <span class="secret-value" id="budget-val">✦✦✦</span>
        </button>
      </div>

      <div class="secret-card">
        <button class="eye-btn" data-eye aria-label="إظهار أو إخفاء المبالغ">
          <svg viewBox="0 0 24 24" class="gi"><g fill="none" stroke="currentColor" stroke-width="1.9"><path d="M1.8 12S5.5 5.5 12 5.5 22.2 12 22.2 12 18.5 18.5 12 18.5 1.8 12 1.8 12z"/><circle cx="12" cy="12" r="3.2"/></g></svg>
        </button>
        <button class="secret-main" id="card-savings" aria-label="تعديل المدخرات">
          <span class="secret-label">المدخرات</span>
          <span class="secret-value" id="savings-val">✦✦✦</span>
        </button>
      </div>

      <div class="total-card">
        <div class="total-text">
          <div class="total-label" id="total-label">الـمـجـمـوع</div>
          <div class="total-value"><span id="total-amount">0.000</span> <span class="cur" id="total-cur">ر.ع</span></div>
        </div>
        <div class="wallet-circle" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#E9C46A" d="M3 7a3 3 0 0 1 3-3h11a1 1 0 1 1 0 2H6a1 1 0 0 0 0 2h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7zm14 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
        </div>
      </div>

      <div class="sum-card">
        <span class="sum-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></g></svg>
        </span>
        <span class="sum-label">مجموع المصاريف</span>
        <span class="sum-value"><span id="spent-amount">0.000</span> <span class="cur" id="spent-cur">ر.ع</span></span>
      </div>

      <div class="list" id="expense-list"></div>
      <p class="empty-note" id="empty-note" hidden>لا توجد مصاريف في هذا الشهر</p>

      <button class="wide-btn add-btn" id="btn-add">
        <span class="plus-circle" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span class="wide-btn-text">أضف مصروف جديد</span>
      </button>

      <div class="bottom-bar">
        <button class="settings-mini" id="btn-open-settings" aria-label="الضبط">
          <svg viewBox="0 0 24 24" class="gi"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6l1.5 2.1 2.5-.5.6 2.5 2.4 1-1 2.4 1.6 2-1.9 1.7.5 2.5-2.5.6-1 2.4-2.3-1.1-2.3 1.1-1-2.4-2.5-.6.5-2.5L3.4 12l1.6-2-1-2.4 2.4-1 .6-2.5 2.5.5z"/></g></svg>
          <span>الضبط</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 2) شاشة التفاصيل ============ -->
  <section class="screen" id="screen-detail" aria-label="تفاصيل المصروف">
    <div class="screen-inner">
      <div class="title-panel"><h1>تفاصيل المصروف</h1><span class="gold-underline"></span></div>

      <button class="date-bar" id="btn-date" aria-label="تغيير التاريخ">
        <span class="icon-box sm" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v9H5v-9h14zM7 12h3v3H7v-3z"/></svg>
        </span>
        <span class="date-text" id="date-text">13 يوليو 2026 - الأثنين</span>
      </button>

      <div class="field-label">الملاحظة</div>
      <textarea class="cream note-input" id="note-input" rows="5" maxlength="200" aria-label="ملاحظة المصروف" placeholder="اكتب الملاحظة هنا"></textarea>

      <input class="cream amount-input" id="amount-input" type="text" inputmode="decimal" aria-label="المبلغ" placeholder="0.000">

      <div class="icon-grid" id="icon-grid" role="radiogroup" aria-label="تصنيف المصروف"></div>

      <div class="color-row" id="color-row" role="radiogroup" aria-label="لون التصنيف"></div>

      <button class="wide-btn primary" id="btn-save">
        <span class="btn-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#E9C46A" d="M5 3h11l3 3v15H5V3zm3 1v5h7V4H8zm-1 9h10v6H7v-6z"/></svg>
        </span>
        <span class="wide-btn-text">حفظ</span>
      </button>
      <button class="wide-btn cream-btn" id="btn-back">
        <span class="btn-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="wide-btn-text">رجوع</span>
      </button>
      <button class="wide-btn danger" id="btn-delete">
        <span class="btn-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9z"/></svg>
        </span>
        <span class="wide-btn-text">حذف</span>
      </button>
    </div>
  </section>

  <!-- ============ 3) شاشة الضبط ============ -->
  <section class="screen" id="screen-settings" aria-label="الضبط">
    <div class="screen-inner">
      <div class="title-panel"><h1>الضبط</h1><span class="gold-underline"></span></div>

      <div class="setting-row">
        <span class="setting-name">الصوت</span>
        <button class="switch" id="sw-sound" role="switch" aria-checked="true" aria-label="تشغيل أو إيقاف الصوت"><span class="knob"></span></button>
      </div>

      <div class="setting-block">
        <div class="setting-name">مستوى الصوت <span class="vol-val" id="vol-val">60%</span></div>
        <input type="range" id="vol-range" min="0" max="100" value="60" aria-label="مستوى الصوت">
      </div>

      <div class="setting-block">
        <div class="setting-name">العملة</div>
        <div class="chip-row" id="currency-row" role="radiogroup" aria-label="العملة"></div>
      </div>

      <button class="wide-btn primary" id="btn-export">
        <span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#E9C46A" d="M12 3l5 5h-3v6h-4V8H7l5-5zM5 18h14v3H5v-3z"/></svg></span>
        <span class="wide-btn-text">تصدير البيانات</span>
      </button>
      <button class="wide-btn cream-btn" id="btn-import">
        <span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24" class="gi"><path fill="currentColor" d="M12 14l-5-5h3V3h4v6h3l-5 5zM5 18h14v3H5v-3z"/></svg></span>
        <span class="wide-btn-text">استيراد البيانات</span>
      </button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="wide-btn danger" id="btn-wipe">
        <span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24" class="gi"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9z"/></svg></span>
        <span class="wide-btn-text">مسح كل البيانات</span>
      </button>

      <button class="wide-btn cream-btn" id="btn-back-settings">
        <span class="btn-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="gi"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="wide-btn-text">رجوع</span>
      </button>

      <p class="version-note">مصاريفي الشهرية — الإصدار 1.0</p>
    </div>
  </section>

  <!-- ============ نافذة التقويم ============ -->
  <div class="overlay" id="cal-overlay" hidden>
    <div class="modal cal-modal" role="dialog" aria-modal="true" aria-label="اختيار التاريخ">
      <div class="cal-head">
        <button class="arrow" id="cal-prev" aria-label="الشهر السابق"><svg viewBox="0 0 24 24" class="gi"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="cal-title" id="cal-title">يوليو 2026</div>
        <button class="arrow" id="cal-next" aria-label="الشهر التالي"><svg viewBox="0 0 24 24" class="gi"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="cal-week" id="cal-week"></div>
      <div class="cal-grid" id="cal-grid"></div>
      <button class="wide-btn cream-btn" id="cal-cancel"><span class="wide-btn-text">إلغاء</span></button>
    </div>
  </div>

  <!-- ============ نافذة إدخال مبلغ ============ -->
  <div class="overlay" id="num-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="num-title">
      <div class="dlg-msg" id="num-title">المبلغ الإجمالي</div>
      <input class="cream amount-input" id="num-input" type="text" inputmode="decimal" aria-label="المبلغ" placeholder="0.000">
      <div class="dlg-actions">
        <button class="wide-btn primary" id="num-ok">
          <span class="btn-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="#E9C46A" d="M5 3h11l3 3v15H5V3zm3 1v5h7V4H8zm-1 9h10v6H7v-6z"/></svg></span>
          <span class="wide-btn-text">حفظ</span>
        </button>
        <button class="wide-btn cream-btn" id="num-cancel"><span class="wide-btn-text">إلغاء</span></button>
      </div>
    </div>
  </div>

  <!-- ============ نافذة التأكيد / التنبيه ============ -->
  <div class="overlay" id="dlg-overlay" hidden>
    <div class="modal dlg-modal" role="alertdialog" aria-modal="true" aria-labelledby="dlg-msg">
      <div class="dlg-msg" id="dlg-msg"></div>
      <div class="dlg-actions">
        <button class="wide-btn danger" id="dlg-ok"><span class="wide-btn-text">تأكيد</span></button>
        <button class="wide-btn cream-btn" id="dlg-cancel"><span class="wide-btn-text">إلغاء</span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="sounds.js"></script>
<script src="app.js"></script>
<script>
  // تسجيل Service Worker ليعمل التطبيق بدون إنترنت بعد التثبيت
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
